# Optional: self-hosting with automatic HTTPS. On Vercel this file is not used (see docs/deployment.md).
#
#   1. cp .env.example .env     and fill it in (never commit it)
#   2. set DOMAIN in .env       e.g. DOMAIN=home.example.com   (also MCP_ALLOWED_HOSTS / MCP_ALLOWED_ORIGINS)
#   3. docker compose run --rm tools db:migrate
#      docker compose run --rm tools token -- create my-agent --scope read
#   4. docker compose up -d
#
# Only Caddy is reachable from the internet. The app has no published port: it is on the private network.

services:
  app:
    build:
      context: .
      target: runner
    image: nando-smart-home:latest
    env_file: .env
    environment:
      NODE_ENV: production
      # Caddy is exactly one proxy in front of the app. Required so requests are seen as HTTPS and
      # client IPs come from the proxy's X-Forwarded-For rather than from a forgeable header.
      TRUSTED_PROXY_HOPS: "1"
    expose:
      - "3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. home.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  # Operator tools, started on demand only:  docker compose run --rm tools token -- list
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    env_file: .env

volumes:
  caddy_data:
  caddy_config:
