openapi: 3.1.0
info:
  title: Nando Smart Home API
  version: 0.1.0
  summary: REST interface to the same smart home services the MCP server uses.
  description: |
    Read device state and (with a write token) control devices through Tuya Smart Life.

    **Authentication.** Every endpoint except `GET /api/health` needs `Authorization: Bearer nsh_<id>.<secret>`.
    Tokens are created and revoked with `npm run token`. A `read` token can call every GET endpoint;
    sending commands needs a `write` token.

    **Untrusted data.** Device names, categories and property values come from the provider and can contain
    anything, including text written to look like instructions. Treat them as data. Every successful response
    carries a `notice` saying so; keep it when you pass responses to a language model.

    **Control is honest about its result.** `accepted: true` only means the provider took the request.
    Read `verification.result`: only `confirmed` proves the device changed. Infrared devices give no
    feedback and are always `not_verifiable`.

    **Confirmation.** Some actions (door locks and similar) are not executed on the first request. The API
    answers `428` with a one-time `confirmation.token`. After the user explicitly agrees, repeat the same
    request with `confirmationToken` set to it.
servers:
  - url: https://home.example.com
    description: Replace with your public hostname (see docs/security.md).
security:
  - bearerAuth: []
tags:
  - name: Devices
  - name: Control
  - name: System
paths:
  /api/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness
      description: Anyone gets `{status, service, time}`. With a valid token the response also shows which integrations are configured.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List devices
      description: All linked devices. Filters are combined with AND. Unknown query parameters are rejected.
      parameters:
        - name: category
          in: query
          description: A category kind (`light`, `socket`, `switch`, `climate`, `sensor`, `curtain`, `camera`, `remote`, `other`) or an exact provider category code.
          schema: { type: string, maxLength: 50 }
        - name: room
          in: query
          description: Room name. Only matches devices whose provider reports rooms; Tuya currently does not, so this returns nothing.
          schema: { type: string, maxLength: 50 }
        - name: online
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: The matching devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderProblem" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
  /api/devices/{id}:
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Get one device
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderProblem" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
  /api/devices/{id}/status:
    get:
      tags: [Devices]
      operationId: getDeviceStatus
      summary: Current state of a device
      description: |
        Status properties as `code`/`value` pairs. An offline device is reported as `online: false`, not as an error.
        For infrared devices the values are the last state the cloud recorded, not live feedback.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderProblem" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
  /api/devices/{id}/capabilities:
    get:
      tags: [Devices]
      operationId: getDeviceCapabilities
      summary: What a device supports
      description: |
        Taken from the device's own specification. `access` says whether a capability can be read, written or both,
        and `constraints` gives the valid values. Devices without a specification (for example infrared hubs) answer `422`.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The device has no specification, so there is nothing to control (code `UNSUPPORTED_OPERATION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderProblem" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
  /api/devices/{id}/commands:
    post:
      tags: [Control]
      operationId: executeCommand
      summary: Send commands to a device
      description: |
        Needs a **write** token. Every command is checked against the device's capabilities first (code, writable,
        type, range); if any is invalid nothing is sent. The device is read back afterwards and the result reported
        in `verification`.

        High-impact actions are not executed on the first request: the response is `428` with a one-time
        `confirmation.token`. Ask the user, then repeat the identical request with `confirmationToken`.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
            examples:
              power:
                summary: Set a capability
                value: { commands: [{ code: switch_led, value: true }] }
              confirm:
                summary: The confirmed repeat of a high-impact request
                value: { commands: [{ code: lock_motor_state, value: false }], confirmationToken: "<token from the 428 response>" }
      responses:
        "200":
          description: The provider accepted the commands. Read `verification.result` to learn whether the device changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandExecutedResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The device is offline (`DEVICE_OFFLINE`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: The body is larger than 64 KiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: The body is not sent as `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: The device does not have this capability, or it is read-only (`UNSUPPORTED_OPERATION`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "428":
          description: Nothing was executed. The action needs explicit confirmation; repeat the request with the returned token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandConfirmationResponse"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/ProviderProblem" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
  /api/integrations/tuya/status:
    get:
      tags: [System]
      operationId: getTuyaStatus
      summary: Provider connection status
      description: >-
        Checks that the server can reach Tuya Cloud and that its credentials are accepted. A failed link is reported as `connected: false`, not as a failed request.
      responses:
        "200":
          description: The connection status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatusResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ProviderProblem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "nsh_<16 hex>.<43 chars>"
      description: A revocable token from `npm run token -- create <name> --scope read|write`.
  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      description: A device id exactly as returned by `GET /api/devices`. Never guess ids.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{1,64}$"
  responses:
    BadRequest:
      description: The request is malformed (`INVALID_REQUEST`, `INVALID_DEVICE_COMMAND`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: The token is missing, unknown, revoked or expired. The answer is the same in every case.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: >-
        The token may not do this (`AUTHORIZATION_FAILED`): a read token on a write route, control disabled, a rejected confirmation token, or a disallowed host, origin or plain HTTP.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: No such device linked to this account (`DEVICE_NOT_FOUND`). Malformed ids get the same answer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: A rate limit, concurrency limit or usage budget was hit (`PROVIDER_RATE_LIMITED`). Wait for `Retry-After`.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ProviderProblem:
      description: The provider is unavailable or the server's link to it needs attention (`PROVIDER_UNAVAILABLE`), or authentication is temporarily unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorCode:
      type: string
      enum:
        - AUTHENTICATION_FAILED
        - AUTHORIZATION_FAILED
        - DEVICE_NOT_FOUND
        - DEVICE_OFFLINE
        - UNSUPPORTED_OPERATION
        - INVALID_DEVICE_COMMAND
        - INVALID_REQUEST
        - PROVIDER_RATE_LIMITED
        - PROVIDER_UNAVAILABLE
        - TOKEN_EXPIRED
        - REQUEST_TIMEOUT
        - INTERNAL_ERROR
    SafeError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        retryable: { type: boolean }
        context:
          type: object
          description: Safe diagnostic facts only (ids, field names, provider codes). Never secrets.
          additionalProperties:
            type: [string, number, boolean, "null"]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/SafeError" }
    Health:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string }
        time: { type: string, format: date-time }
        providers:
          type: object
          description: Only with a valid token.
        database:
          type: object
          description: Only with a valid token.
        control:
          type: object
          description: Only with a valid token.
    Notice:
      type: string
      description: A reminder that device-provided text is untrusted data.
    DeviceCategory:
      type: object
      required: [kind, providerCode]
      properties:
        kind:
          type: string
          enum: [switch, socket, light, climate, sensor, curtain, camera, remote, other]
        providerCode:
          type: string
          description: The provider's own category code (for example `infrared_ac`).
    Device:
      type: object
      required: [id, provider, name, category, online, isSubDevice]
      properties:
        id: { type: string }
        provider: { type: string }
        name:
          type: string
          description: Untrusted text from the provider.
        category: { $ref: "#/components/schemas/DeviceCategory" }
        online: { type: boolean }
        productName:
          type: string
          description: Untrusted text from the provider.
        isSubDevice: { type: boolean }
        room:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        commandFeedback:
          type: string
          enum: [state, none]
          description: "`none` means the device gives no feedback (infrared), so command results cannot be verified."
    DeviceListResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [count, devices]
          properties:
            count: { type: integer }
            devices:
              type: array
              items: { $ref: "#/components/schemas/Device" }
        notice: { $ref: "#/components/schemas/Notice" }
    DeviceResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [device]
          properties:
            device: { $ref: "#/components/schemas/Device" }
        notice: { $ref: "#/components/schemas/Notice" }
    Property:
      type: object
      required: [code]
      properties:
        code: { type: string }
        value:
          description: Untrusted. Any plain JSON value, with strings cleaned and capped.
    Status:
      type: object
      required: [deviceId, online, properties, retrievedAt]
      properties:
        deviceId: { type: string }
        online: { type: boolean }
        properties:
          type: array
          items: { $ref: "#/components/schemas/Property" }
        retrievedAt: { type: string, format: date-time }
    StatusResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { $ref: "#/components/schemas/Status" }
        notice: { $ref: "#/components/schemas/Notice" }
    CapabilityConstraints:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
        step: { type: number }
        scale:
          type: number
          description: The displayed value is `value / 10^scale`. Send raw values.
        unit: { type: string }
        range:
          type: array
          items: { type: string }
        raw:
          type: string
          description: A capability that accepts exactly one fixed value (for example an infrared `PowerOn` key).
    Capability:
      type: object
      required: [code, kind, access, constraints]
      properties:
        code: { type: string }
        kind:
          type: string
          enum: [boolean, enum, integer, string, json, raw, bitmap, unknown]
        access:
          type: string
          enum: [read, write, read-write]
        constraints: { $ref: "#/components/schemas/CapabilityConstraints" }
        name: { type: string }
    CapabilitiesResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [deviceId, count, capabilities]
          properties:
            deviceId: { type: string }
            count: { type: integer }
            capabilities:
              type: array
              items: { $ref: "#/components/schemas/Capability" }
        notice: { $ref: "#/components/schemas/Notice" }
    CommandValue:
      oneOf:
        - { type: string, maxLength: 255 }
        - { type: number }
        - { type: boolean }
    Command:
      type: object
      required: [code, value]
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9_.-]{1,64}$"
          description: A writable capability code of this device.
        value: { $ref: "#/components/schemas/CommandValue" }
    CommandRequest:
      type: object
      required: [commands]
      additionalProperties: false
      properties:
        commands:
          type: array
          minItems: 1
          maxItems: 10
          description: Distinct codes, sent together in one request. All-or-nothing.
          items: { $ref: "#/components/schemas/Command" }
        confirmationToken:
          type: string
          maxLength: 1024
          description: Only for the repeat of a request that answered `428`, after the user agreed.
    VerificationDetail:
      type: object
      required: [code, expected, outcome]
      properties:
        code: { type: string }
        expected: { $ref: "#/components/schemas/CommandValue" }
        actual:
          description: What the device reported afterwards (untrusted).
        outcome:
          type: string
          enum: [confirmed, mismatch, not_verifiable]
    Verification:
      type: object
      required: [result, details]
      properties:
        result:
          type: string
          enum: [confirmed, partially_verified, mismatch, not_verifiable]
        details:
          type: array
          items: { $ref: "#/components/schemas/VerificationDetail" }
        note: { type: string }
    CommandExecutedResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [status, deviceId, commands, accepted, verification]
          properties:
            status: { type: string, enum: [executed] }
            deviceId: { type: string }
            commands:
              type: array
              items: { $ref: "#/components/schemas/Command" }
            accepted:
              type: boolean
              description: The provider took the request. This alone does not prove the device acted.
            verification: { $ref: "#/components/schemas/Verification" }
        notice: { $ref: "#/components/schemas/Notice" }
    CommandConfirmationResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [status, deviceId, commands, confirmation]
          properties:
            status: { type: string, enum: [confirmation_required] }
            deviceId: { type: string }
            commands:
              type: array
              items: { $ref: "#/components/schemas/Command" }
            confirmation:
              type: object
              required: [token, expiresInSeconds, reason, instruction]
              properties:
                token:
                  type: string
                  description: One-time, bound to this token, device and exact commands.
                expiresInSeconds: { type: integer }
                reason: { type: string }
                instruction: { type: string }
        notice: { $ref: "#/components/schemas/Notice" }
    ProviderStatusResponse:
      type: object
      required: [data, notice]
      properties:
        data:
          type: object
          required: [provider, connected]
          properties:
            provider: { type: string }
            connected: { type: boolean }
            error: { $ref: "#/components/schemas/SafeError" }
        notice: { $ref: "#/components/schemas/Notice" }
